# Overlay for the development Mac. To be used only together with docker-compose.yml, most easily
# through `make prod-mac`.
#
# It changes exactly two mounts and nothing else: the same images, the same nginx configuration,
# the same entrypoint. Everything that makes up container operation is therefore really checked
# and not bypassed.
#
# Why at all: /media does not exist under macOS -- mounted volumes lie under /Volumes. And
# `rshared` is a mount propagation of the Linux kernel that does not pass through Docker Desktop's
# file sharing. Both are right on the Pi but cannot be reproduced here.
#
# IT FOLLOWS THAT: the USB path of the backup is NOT checked on the Mac. A stick plugged in after
# the start stays invisible here, and that is exactly the case `rshared` is meant to solve on the
# Pi. This belongs on a device -- see backlog point 18 and point 15.

services:
  backend:
    volumes:
      # Compose merges volumes by their target path, so these two replace the ones of the same
      # name from docker-compose.yml instead of standing beside them.
      #
      # The default is the same collection as in operation. Whoever wants to check against a copy
      # -- recommended, because the entrypoint pulls the schema forward on every start -- sets the
      # path relative to this directory:
      #   KIEKMAP_PROD_DATA=../../kiekmap-prodtest/data make prod-mac
      - ${KIEKMAP_PROD_DATA:-../data}:/data
      - /Volumes:/media
