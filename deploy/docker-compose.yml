# Betriebsaufbau fuer den Museums-Pi.
#
# Zwei Dienste. Chromium ist bewusst KEIN Container -- er laeuft als gewoehnliches Programm auf dem
# Pi (siehe deploy/pi/kiekmap-kiosk.service) und zeigt nur an, was diese beiden ausliefern.

name: kiekmap

services:
  backend:
    build:
      context: ../backend
    image: kiekmap-backend:${KIEKMAP_VERSION:-dev}
    restart: unless-stopped
    # Die ganze .env, nicht eine Auswahl daraus.
    #
    # Sie liegt bewusst nicht im Abbild -- das Abbild ist die Software, die .env ist der Ort.
    # Frueher standen nur einzelne Werte unter `environment:`, und die uebrigen fielen im Betrieb
    # still auf ihre Vorgaben zurueck: Ein Import im Container verlor Schlagwort, Bildnachweis
    # und Herkunftspraefix, ohne dass etwas fehlschlug. Gemessen am 14. August 2026.
    #
    # Wer hier eintraegt, aendert also den Betrieb -- das ist der Sinn: ein zweites Museum
    # braucht eine eigene .env und keinen Fork. Siehe docs/adaption.md.
    env_file: ../.env
    environment:
      # Diese vier gewinnen ueber die .env: sie beschreiben den Container, nicht den Ort.
      KIEKMAP_DATA_DIR: /data
      KIEKMAP_MEDIA_DIR: /media
      KIEKMAP_ADMIN_PIN_HASH: ${KIEKMAP_ADMIN_PIN_HASH:-}
      # Gleiche Herkunft im Betrieb, also keine CORS-Ausnahmen noetig.
      KIEKMAP_CORS_ORIGINS: "[]"
    volumes:
      - ../data:/data
      # USB-Sticks fuer die Sicherung (Stufe 9). rshared ist noetig, damit ein erst spaeter
      # eingesteckter Stick im Container ueberhaupt sichtbar wird -- ohne das bleibt der Ordner
      # leer, und zwar ohne jede Fehlermeldung.
      - /media:/media:rshared
    # Nach aussen nicht veroeffentlicht: nur nginx spricht mit dem Backend.
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
    image: kiekmap-frontend:${KIEKMAP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      # Kartendatei und Regionsdefinition werden nicht ins Image gebacken: sie sind gross bzw.
      # ortsabhaengig und aendern sich unabhaengig von der Software. Erzeugt von `make tiles`.
      - ../frontend/public/tiles:/usr/share/nginx/html/tiles:ro
