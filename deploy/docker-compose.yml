# The operating setup for the museum Pi.
#
# Two services. Chromium is deliberately NOT a container -- it runs as an ordinary program on the
# Pi (see deploy/pi/kiekmap-kiosk.service) and only displays what these two deliver.

name: kiekmap

services:
  backend:
    build:
      context: ../backend
    image: kiekmap-backend:${KIEKMAP_VERSION:-dev}
    restart: unless-stopped
    # The whole .env, not a selection from it.
    #
    # It deliberately does not sit in the image -- the image is the software, the .env is the
    # place. Earlier only single values stood under `environment:`, and the rest fell back to
    # their defaults in operation, silently: an import inside the container lost its tag, its
    # credit and its provenance prefix without anything failing. Measured on 14 August 2026.
    #
    # Whoever writes here changes the operation -- that is the point: a second museum needs its
    # own .env and no fork. See docs/adaption.md.
    env_file: ../.env
    environment:
      # These four win over the .env: they describe the container, not the place.
      KIEKMAP_DATA_DIR: /data
      KIEKMAP_MEDIA_DIR: /media
      KIEKMAP_ADMIN_PIN_HASH: ${KIEKMAP_ADMIN_PIN_HASH:-}
      # Same origin in operation, so no CORS exceptions are needed.
      KIEKMAP_CORS_ORIGINS: "[]"
    volumes:
      - ../data:/data
      # USB sticks for the backup (stage 9). rshared is needed for a stick plugged in later to
      # become visible inside the container at all -- without it the folder stays empty, and
      # without any error message.
      - /media:/media:rshared
    # Not published outwards: only nginx talks to the backend.
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
    image: kiekmap-frontend:${KIEKMAP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      # The map file and the region definition are not baked into the image: they are large or
      # place-dependent and change independently of the software. Built by `make tiles`.
      - ../frontend/public/tiles:/usr/share/nginx/html/tiles:ro
