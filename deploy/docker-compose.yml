# Betriebsaufbau fuer den Museums-Pi.
#
# Zwei Dienste. Chromium ist bewusst KEIN Container -- er laeuft als gewoehnliches Programm auf dem
# Pi (siehe deploy/pi/photomap-kiosk.service) und zeigt nur an, was diese beiden ausliefern.

name: photomap

services:
  backend:
    build:
      context: ../backend
    image: photomap-backend:${PHOTOMAP_VERSION:-dev}
    restart: unless-stopped
    environment:
      PHOTOMAP_DATA_DIR: /data
      PHOTOMAP_MEDIA_DIR: /media
      PHOTOMAP_ADMIN_PIN_HASH: ${PHOTOMAP_ADMIN_PIN_HASH:-}
      # Gleiche Herkunft im Betrieb, also keine CORS-Ausnahmen noetig.
      PHOTOMAP_CORS_ORIGINS: "[]"
    volumes:
      - ../data:/data
      # USB-Sticks fuer die Sicherung (Stufe 9). rshared ist noetig, damit ein erst spaeter
      # eingesteckter Stick im Container ueberhaupt sichtbar wird -- ohne das bleibt der Ordner
      # leer, und zwar ohne jede Fehlermeldung.
      - /media:/media:rshared
    # Nach aussen nicht veroeffentlicht: nur nginx spricht mit dem Backend.
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
    image: photomap-frontend:${PHOTOMAP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      # Kartendatei und Regionsdefinition werden nicht ins Image gebacken: sie sind gross bzw.
      # ortsabhaengig und aendern sich unabhaengig von der Software. Erzeugt von `make tiles`.
      - ../frontend/public/tiles:/usr/share/nginx/html/tiles:ro
