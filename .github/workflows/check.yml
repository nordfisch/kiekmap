# What should run before every commit anyway -- in one place where nobody can forget it.
#
# The hook under .githooks/ takes the six fast checks off your hands, but only for whoever
# switched it on. And `make check` today says only that it was green on *my* machine; here it
# stands on the pull request.
#
# It answers in passing the question from point 22, what happens to THIRD-PARTY.txt: it is
# generated and checked in, therefore current -- but only as long as somebody runs `make check`.
name: check

on:
  # On feature branches the pull request takes over; nothing needs to run twice.
  push:
    branches: [main, develop]
  pull_request:

# The workflow only reads. A token that may not write can do no damage.
permissions:
  contents: read

# A new push replaces the previous run. On a private repository that saves free minutes.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 3.12 as in backend/pyproject.toml, 22 as in the frontend image. Both pinned: "latest"
      # would be a version that changes behind your back.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5

      # npm ci instead of npm install: it keeps to package-lock.json instead of writing it
      # forward. The touch makes make regard the directory as finished.
      - name: frontend packages
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          touch node_modules

      # deps-lock after venv, and the order is the point: venv installs from pyproject.toml,
      # therefore unpinned; deps-lock pulls the versions of the lock file over it. Without that
      # build_notices.py aborts -- and that is exactly right, because the licence notices would
      # then not be those of the image.
      - name: Python environment
        run: |
          make venv
          make deps-lock

      - name: make check
        run: make check
