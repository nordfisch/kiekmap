# The documentation site at https://nordfisch.github.io/kiekmap/
#
# It builds from the newest tag, not from develop: the museum reads the documentation for the
# version it is running, not for the one being worked on. Whatever is merged and not yet released
# is visible through workflow_dispatch, and publicly with the next tag.
#
# The simple route -- a branch plus /docs -- is not available: GitHub builds that with Jekyll, and
# Jekyll cannot do i18n there.
name: pages

on:
  push:
    tags: ["v*"]
  # Builds a preview from any ref, and rebuilds the newest tag after a change to the site itself.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build from. Empty means the newest tag."
        default: ""
  # Only builds, never deploys: a broken link is worth finding before the release, not after.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/mkdocs_hooks.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history, because the newest tag has to be findable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: which ref
        id: ref
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            ref="${{ inputs.ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            ref="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="${{ github.sha }}"
          else
            ref="$(git describe --tags --abbrev=0)"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building the site from $ref"

      - run: git checkout --detach "${{ steps.ref.outputs.ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt

      # --strict turns a link that goes nowhere into a failed build. That is the point of having
      # this run at all: check_anchors.py watches the links inside the repository, this one
      # watches what becomes of them on the site.
      - name: build
        env:
          KIEKMAP_DOCS_REF: ${{ steps.ref.outputs.ref }}
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
