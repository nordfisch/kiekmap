# The type checker for the backend, the counterpart to `tsc` in the frontend.
#
# Its own file, not a section in pyproject.toml, so that a baseline entry is a line somebody can
# delete without reading the package metadata around it. Moving it into pyproject.toml later
# changes nothing but the location.
#
# Deliberately not `strict`. Strict demands an annotation on every function, including the ones
# whose types a reader can see at a glance, and it would have made the first run unreadable. The
# useful findings -- a service called with a value its signature does not take -- come out of the
# default setting already.

[mypy]
python_version = 3.12
warn_unused_ignores = True
warn_redundant_casts = True

# --- the baseline ------------------------------------------------------------
#
# What the first run over app/ found and what is not fixed. Each section names one module and the
# error codes it still produces; every one of them was looked at. The baseline shrinks by deleting
# a code, and it is empty when the last section goes.
#
# Almost all of them are the types of a library, not of this code. SQLAlchemy describes a
# `Result` without `rowcount`, a `hybrid_property` whose expression is not a `ColumnElement`, and
# a `Row` whose named column `count` is hidden by the `count` method of the tuple it also is.
# Pillow declares `MAX_IMAGE_PIXELS` as `int | None`, although exif.py sets it to a number at
# import time. The rest are values the checker reads as optional that cannot be `None` at that
# point -- the row after an INSERT that returned its id, the first argument of a `ParamSpec`.
#
# The cost is named here because the form hides it: `disable_error_code` switches the code off for
# the whole module, not for the one line. A second, real finding of the same kind would stay
# silent in that module until the entry goes.

[mypy-app.api.admin]
# Result.rowcount after an UPDATE.
disable_error_code = attr-defined

[mypy-app.api.backup]
# JobStatus.items is list[dict], JobState.items is list[UploadItem]; pydantic converts.
disable_error_code = arg-type

[mypy-app.api.contribute]
# Result.rowcount after an UPDATE.
disable_error_code = attr-defined

[mypy-app.api.photos]
# row.count of the histogram query -- the label, not the method of the tuple.
disable_error_code = arg-type

[mypy-app.services.backup.archive]
# _ArchiveStream does not match any of the ZipFile overloads; it carries write, tell, flush and
# seekable, and the archive download is covered by tests.
disable_error_code = call-overload

[mypy-app.services.backup.restore]
# args[0] of a ParamSpec is `object`; the docstring says both routes pass settings first.
disable_error_code = arg-type

[mypy-app.services.exif]
# _decode rebinds its bytes parameter to the decoded str; getiptcinfo wants an ImageFile.
disable_error_code = union-attr, arg-type

[mypy-app.services.importer]
# MAX_IMAGE_PIXELS is int|None to Pillow; the Photo after the INSERT is not None.
disable_error_code = operator, arg-type, assignment

[mypy-app.services.needs]
# The expression of a hybrid_property.
disable_error_code = return-value

[mypy-app.services.places]
# A ColumnElement[bool] into a list[BinaryExpression[bool]].
disable_error_code = arg-type
