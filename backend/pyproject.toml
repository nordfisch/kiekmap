[project]
name = "kiekmap-backend"
version = "0.9.0"
description = "Image database for historic photos of a place, for a local history museum"
requires-python = ">=3.12"
authors = [{ name = "Kalle Erlhoff" }]
license = "Apache-2.0"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2",  # preferred by starlette.testclient; httpx raises a deprecation warning
    "piexif>=1.1",  # only for building the test images with EXIF
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# S is bandit, BLE the rule against a bare `except Exception`. Neither finds anything real today;
# they guard the code that comes later -- a subprocess with a shell, pickle, tempfile.mktemp, a
# secret in the source. The same selection stands in ruff.toml for everything outside backend/.
select = ["E", "F", "I", "UP", "B", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated and import op/sa whether they need them or not. When one is adjusted
# by hand that is exactly what helps -- so do not complain about it.
"alembic/versions/*.py" = ["F401"]
# An assert is what a test is made of. S101 hits every one of them, a thousand times over.
"tests/*.py" = ["S101"]
