# Applies to Python outside backend/ -- above all tiles/.
#
# Ruff always takes the nearest configuration: for backend/ that is backend/pyproject.toml, for
# tiles/ this file. The values therefore have to agree, or `make lint` formats the same code
# differently depending on the folder.
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B"]
