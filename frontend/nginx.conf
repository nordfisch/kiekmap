server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The kiosk is a single page; everything unknown belongs to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite appends a hash to every file name, so it may be cached for as long as you like.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts and sprites of the map. They change only with a new release.
    location /basemaps/ {
        expires 30d;
        add_header Cache-Control "public";
        types { application/x-protobuf pbf; }
    }

    # The map file is read tile by tile through HTTP range requests -- which is exactly why no
    # tile server is needed. nginx serves ranges of static files out of the box; all that matters
    # is that nothing in front of it compresses or buffers them.
    location /tiles/ {
        gzip off;
        add_header Accept-Ranges bytes;
        expires 7d;
    }

    # The backup as one file. It comes into being in the stream, while it is being sent -- and
    # that is what makes `proxy_buffering off` necessary: with the default, nginx gathers the
    # *whole* response on disk before it delivers the first byte. At several gigabytes that disk
    # would be the SD card the backup is meant to protect against. The same trap as the `gzip off`
    # at the tiles: it shows up only with the first large collection.
    #
    # No time limit on sending: a collection of two thousand photos takes minutes over a network
    # cable, and an aborted archive is worthless.
    location = /api/admin/backup/zip {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Photos can be large, and the import uploads them.
        client_max_body_size 128m;
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
