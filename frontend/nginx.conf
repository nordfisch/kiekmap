server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Der Kiosk ist eine Einzelseite; alles Unbekannte gehoert an sie.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite haengt einen Hash an jeden Dateinamen, also darf beliebig lange gecacht werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Schriften und Symbole der Karte. Aendern sich nur mit einem neuen Release.
    location /basemaps/ {
        expires 30d;
        add_header Cache-Control "public";
        types { application/x-protobuf pbf; }
    }

    # Die Kartendatei wird per HTTP-Range-Request kachelweise gelesen -- genau deshalb brauchen wir
    # keinen Tileserver. nginx liefert Bereiche statischer Dateien von Haus aus aus; wichtig ist
    # nur, dass nichts davor sie komprimiert oder puffert.
    location /tiles/ {
        gzip off;
        add_header Accept-Ranges bytes;
        expires 7d;
    }

    # Die Sicherung als eine Datei. Sie entsteht im Strom, waehrend sie gesendet wird -- und genau
    # das macht `proxy_buffering off` noetig: Mit der Voreinstellung sammelt nginx die *ganze*
    # Antwort erst auf der Platte, bevor es das erste Byte ausliefert. Bei mehreren Gigabyte waere
    # das die SD-Karte, vor der die Sicherung gerade schuetzen soll. Derselbe Fallstrick wie das
    # `gzip off` bei den Kacheln: Es faellt erst beim ersten grossen Bestand auf.
    #
    # Kein Zeitlimit auf das Senden: Ein Bestand von zweitausend Fotos braucht ueber ein
    # Netzwerkkabel Minuten, und ein abgebrochenes Archiv ist wertlos.
    location = /api/admin/backup/zip {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fotos koennen gross sein, und der Import laedt sie hoch.
        client_max_body_size 128m;
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
