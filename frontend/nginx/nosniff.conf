# Included in every location of nginx.conf, not set once at server level: nginx passes a
# server-level `add_header` only to locations that define no `add_header` of their own, and most
# locations here set Cache-Control. `always` puts it on error responses as well, such as the 502
# of /api/ while the backend is down.
add_header X-Content-Type-Options "nosniff" always;
